<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>有声书工作台</title>
  <link rel="stylesheet" href="/workbench.css">
  <script type="module" src="/workbench.js"></script>
</head>
<body>
  <div class="workbench" id="workbench">
    <header class="topbar">
      <a class="brand" href="#chapters" aria-label="有声书工作台，章节页">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M4.5 6.5c3.8-.8 6.7 0 9.5 2.3v14c-2.8-2.3-5.7-3.1-9.5-2.3zM23.5 6.5c-3.8-.8-6.7 0-9.5 2.3v14c2.8-2.3 5.7-3.1 9.5-2.3z"/><path d="M14 9v14"/></svg>
        <span>有声书工作台</span>
      </a>
      <nav class="primary-nav" aria-label="主要页面">
        <button type="button" class="nav-item is-active" data-page="chapters" aria-current="page">章节</button>
        <button type="button" class="nav-item" data-page="editor">校听</button>
        <button type="button" class="nav-item" data-page="voices">人物与声音</button>
      </nav>
      <div class="topbar-tools">
        <label class="book-control" for="book-select"><span>当前书籍</span><select id="book-select" aria-label="选择书籍"><option value="">选择书籍</option></select></label>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换浅色或深色主题" title="切换主题">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.6 8.6 0 0 1 8.9 3.8 8.8 8.8 0 1 0 20.2 15.1Z"/></svg>
        </button>
        <button class="button button-subtle" id="billing-toggle" type="button" aria-expanded="false" aria-controls="billing-panel">费用记录</button>
        <button class="button button-subtle exit-button" id="shutdown-button" type="button" data-action="shutdown" title="关闭空闲的本机工作台">退出工作台</button>
      </div>
    </header>

    <div class="workspace">
      <main class="main-area" id="main-area">
        <div class="live-status" id="live-status" role="status" aria-live="polite">正在连接本机工作台…</div>
        <div id="page-content" tabindex="-1"></div>
      </main>
    </div>

    <section class="billing-panel" id="billing-panel" aria-labelledby="billing-title" hidden>
      <div class="billing-head">
      <div><h2 id="billing-title">费用估算</h2><p class="muted">按所填单价估算，实际扣款以供应商账单为准。</p></div>
        <button class="icon-button" id="billing-close" type="button" aria-label="关闭费用记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="billing-controls" id="billing-controls"></div>
      <p class="billing-summary" id="billing-summary">尚未读取用量。</p>
      <div class="billing-list" id="billing-list" aria-live="polite"></div>
      <p class="error-copy" id="billing-error" hidden></p>
    </section>

    <footer class="player-dock" aria-label="音频播放控制">
      <audio id="audio-player" preload="none" playsinline></audio>
      <div class="player-ident">
        <span class="player-art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 18V6l14-2v12M5 18a2.5 2.5 0 1 1-2.5-2.5A2.5 2.5 0 0 1 5 18Zm14-2a2.5 2.5 0 1 1-2.5-2.5A2.5 2.5 0 0 1 19 16Z"/></svg></span>
        <span class="player-copy"><strong id="player-title">尚未选择音频</strong><span id="player-subtitle">试听和校听会显示在这里</span></span>
      </div>
      <div class="player-center">
        <div class="player-buttons">
          <button class="icon-button" id="player-stop" type="button" aria-label="停止播放" title="停止播放"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
          <button class="play-button" id="player-play" type="button" aria-label="播放音频"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></button>
          <span class="speed-control"><label class="visually-hidden" for="playback-speed">播放速度</label><select id="playback-speed" aria-label="播放速度"><option value="1">1.0×</option><option value="0.8">0.8×</option><option value="1.08">1.08×</option><option value="1.1">1.10×</option><option value="1.2">1.2×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></span>
        </div>
        <div class="progress-row"><span class="time-label" id="audio-current">0:00</span><input id="audio-seek" type="range" min="0" max="1000" value="0" aria-label="音频进度" disabled><span class="time-label" id="audio-duration">0:00</span></div>
      </div>
      <div class="player-tail"><span class="playing-indicator" id="playing-indicator" aria-hidden="true"></span><span id="player-state">待播放</span></div>
    </footer>
  </div>
</body>
</html>
